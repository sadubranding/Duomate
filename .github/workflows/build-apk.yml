name: Build DuoMate APK

# এই ফাইলটাই সেই "অটো-বিল্ড রোবট"।
# GitHub-এ কোড push/upload করলেই এটা নিজে থেকে চালু হয়ে
# একটা APK বানিয়ে ফেলবে, যেটা "Actions" ট্যাব থেকে ডাউনলোড করা যাবে।

on:
  push:
    branches: [ main ]
  release:
    types: [ published ] # Release বানালেই APK সেই Release-এ যুক্ত হয়ে যাবে
  workflow_dispatch: # "Run workflow" বাটন দিয়ে হাতে চালানোর অপশনও থাকবে

permissions:
  contents: write # Release-এ APK যুক্ত করার জন্য প্রয়োজনীয় অনুমতি

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড checkout করা
        uses: actions/checkout@v4

      - name: Flutter ইনস্টল করা
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android platform ফোল্ডার তৈরি করা
        run: flutter create --platforms=android --org com.duomate --project-name duomate .

      - name: Android build সেটিংস আপডেট করা (compileSdk + desugaring)
        # নতুন প্লাগিনগুলো (নোটিফিকেশন, ফাইল পিকার ইত্যাদি) নতুন Android SDK
        # আর "core library desugaring" চায় — এই ধাপ সেটা আগে থেকেই ঠিক করে রাখে,
        # যাতে ভবিষ্যতে নতুন প্লাগিন যোগ করলে বিল্ড আবার না ভাঙে।
        # রুট build.gradle.kts-এ patch করছি যাতে app-এর পাশাপাশি
        # file_picker-এর মতো সব প্লাগিনও compileSdk 36 ব্যবহার করে।
        run: |
          sed -i '/isCoreLibraryDesugaringEnabled/d' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts << 'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              val applyCompileSdk: () -> Unit = {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let {
                      it.compileSdkVersion(36)
                  }
              }
              if (state.executed) {
                  applyCompileSdk()
              } else {
                  afterEvaluate { applyCompileSdk() }
              }
          }
          EOF

      - name: নোটিফিকেশন পারমিশন যোগ করা
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: প্যাকেজগুলো ডাউনলোড করা
        run: flutter pub get

      - name: ডাটাবেজ কোড জেনারেট করা (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: APK বিল্ড করা (release version)
        run: flutter build apk --release

      - name: APK আপলোড করা (Actions ট্যাব থেকে ডাউনলোডযোগ্য)
        uses: actions/upload-artifact@v4
        with:
          name: duomate-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: APK কে Release-এর সাথে যুক্ত করা
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
